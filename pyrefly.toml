# Pyrefly Configuration for Workspace Root
search-path = [
    "compliance-rag-agent/backend",
    "compliance-rag-agent/backend/apps"
]
python-interpreter-path = "compliance-rag-agent/backend/.venv/Scripts/python.exe"
disable-search-path-heuristics = true

[errors]
bad-argument-type = "warn"
bad-override = "warn"
bad-override-mutable-attribute = "warn"
missing-stub = "ignore"
deprecated = "ignore"
redundant-condition = "ignore"
